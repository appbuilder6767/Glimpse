<style>
:root{
  --accent:#ff3d68; --save:#ffc83d; --violet:#7a4dff;
  --sheet:#151519; --sheet2:#1f1f25; --line:rgba(255,255,255,.1);
  --muted:rgba(255,255,255,.7); --faint:rgba(255,255,255,.45);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;overscroll-behavior:none;
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{position:fixed;inset:0;overflow:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}
.i{width:24px;height:24px;flex:none}
#app{position:fixed;inset:0;max-width:540px;margin:0 auto;overflow:hidden;background:#000}

/* ---------- feed ---------- */
#feed{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;
  scrollbar-width:none;touch-action:pan-y}
#feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000}
.stage{position:absolute;inset:0;background:var(--c,#0d0d10);overflow:hidden}
.stage .bg{position:absolute;left:-10%;top:-10%;width:120%;height:120%;object-fit:cover;filter:blur(26px) brightness(.5) saturate(1.2);pointer-events:none}
.stage .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .25s}
.stage .fg.cover{object-fit:cover}
.stage .fail{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:14px;padding:40px;text-align:center}
.shade{position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.35) 45%,rgba(0,0,0,0))}
.info{position:absolute;left:14px;right:86px;bottom:calc(20px + var(--sb));text-shadow:0 1px 3px rgba(0,0,0,.55)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;letter-spacing:.01em;
  padding:4px 9px 4px 7px;border-radius:99px;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);text-shadow:none}
.badge .i{width:14px;height:14px}
.title{font-size:16px;font-weight:700;line-height:1.3;margin:9px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.credit{margin:0;font-size:13px;color:var(--muted)}
.credit a{color:#fff;font-weight:650;text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:2px}
.tags{display:flex;gap:6px;margin-top:10px;overflow:hidden}
.tag{font-size:13px;font-weight:650;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.2);white-space:nowrap;text-shadow:none}
.rail{position:absolute;right:8px;bottom:calc(92px + var(--sb));display:flex;flex-direction:column;gap:12px;align-items:center}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;font-size:11px;font-weight:650;text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 1px rgba(0,0,0,.9)}
.act .ring{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .15s}
.act .i{width:28px;height:28px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.act:active .ring{transform:scale(.88)}
.act.like.on .i{color:var(--accent)} .act.save.on .i{color:var(--save)}
.act.pop .ring{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.25)}100%{transform:scale(1)}}
.progress{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.15)}
.progress i{display:block;height:100%;width:0;background:#fff}
.paused-ico{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:rgba(0,0,0,.35);display:grid;place-items:center;pointer-events:none}
.paused-ico .i{width:44px;height:44px;margin-left:5px}
.burst{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;color:var(--accent);pointer-events:none;z-index:5;animation:burst .75s ease-out forwards;filter:drop-shadow(0 4px 14px rgba(0,0,0,.4))}
.burst .i{width:100%;height:100%}
@keyframes burst{0%{transform:scale(.2) rotate(-12deg);opacity:0}18%{transform:scale(1.15) rotate(-12deg);opacity:1}32%{transform:scale(.95) rotate(-12deg)}75%{opacity:1}100%{transform:scale(1.25) translateY(-70px) rotate(-12deg);opacity:0}}

/* YouTube slides: the player is never covered by anything */
.slide.yt .player{position:absolute;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.slide.yt iframe{display:block;width:100%;height:100%;border:0}
.slide.yt .poster{position:absolute;inset:0;width:100%;height:100%;display:grid;place-items:center}
.slide.yt .poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide.yt .poster span{position:relative;width:68px;height:48px;border-radius:14px;background:rgba(0,0,0,.65);display:grid;place-items:center}
.slide.yt .info{right:14px;bottom:calc(86px + var(--sb))}
.slide.yt .rail{flex-direction:row;left:0;right:0;justify-content:space-evenly;bottom:calc(8px + var(--sb))}
.slide.yt .act{width:auto;flex-direction:row;gap:6px;font-size:13px;padding:0 4px}
.slide.yt .act .ring{width:42px;height:42px;background:rgba(255,255,255,.1)}
.slide.yt .act .i{width:23px;height:23px}

/* notice slides (welcome, setup, end of feed) */
.notice{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:14px;
  padding:calc(74px + var(--st)) 26px calc(36px + var(--sb));overflow-y:auto;
  background:radial-gradient(120% 70% at 0% 0%,rgba(255,77,109,.28),transparent 60%),radial-gradient(120% 70% at 100% 100%,rgba(106,61,240,.32),transparent 60%),#07070a}
.notice h1{font-size:34px;line-height:1.05;margin:0;letter-spacing:-.03em}
.notice h2{font-size:24px;margin:0;letter-spacing:-.02em}
.notice p{margin:0;color:var(--muted);font-size:15px}
.notice ol{margin:0;padding-left:20px;color:var(--muted)} .notice li{margin:4px 0}
.notice code{background:rgba(255,255,255,.1);padding:1px 6px;border-radius:6px;font-size:13px;color:#fff}
.logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#ff4d6d,#6a3df0)}
.logo .i{width:30px;height:30px}
.notice p .i,.sh-body p .i{width:17px;height:17px;vertical-align:-3px}
.i.inl{color:var(--accent)}
.sbar>.i{width:20px;height:20px;color:var(--faint)}
@media (max-height:520px){.slide.yt .tags{display:none}}
.fine{font-size:12.5px!important;color:var(--faint)!important}
.fine a{color:var(--muted)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#fff;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.center{align-items:center;text-align:center}

/* ---------- forms, chips, buttons ---------- */
.sbar{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:14px;padding:0 6px 0 12px;height:48px}
.sbar input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;height:100%}
.sbar input::placeholder{color:var(--faint)}
.sbar .go{height:36px;padding:0 14px;border-radius:10px;background:#fff;color:#000;font-weight:700;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:99px;background:rgba(255,255,255,.1);font-size:14px;font-weight:600;max-width:100%}
.chip b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .x{display:grid;place-items:center;width:22px;height:22px;margin-right:-8px;border-radius:50%;color:var(--faint)}
.chip .x .i{width:14px;height:14px}
.chip.hot{background:linear-gradient(135deg,rgba(255,77,109,.35),rgba(106,61,240,.35))}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;background:rgba(255,255,255,.1);font-weight:650;font-size:15px}
.btn.primary{background:#fff;color:#000}
.btn.danger{color:#ff6b81}
.btn.wide{width:100%}
.btn .i{width:20px;height:20px}

/* ---------- top bar ---------- */
#top{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
  padding:calc(6px + var(--st)) 6px 16px 12px;background:linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,0));pointer-events:none}
#top>*{pointer-events:auto}
.tl,.tr{display:flex;align-items:center;gap:2px;min-width:0}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.02em;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.brand small{font-size:13px;font-weight:650;color:var(--muted);letter-spacing:0}
.modechip{display:flex;align-items:center;gap:4px;height:36px;padding:0 14px 0 6px;border-radius:99px;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-weight:700;font-size:15px;max-width:52vw}
.modechip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.tb .i{filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
#spin{width:18px;height:18px;border-width:2px;margin:0 8px}

/* ---------- sheets ---------- */
#scrim{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.show{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:90%;display:flex;flex-direction:column;
  background:var(--sheet);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--sb)}
#sheet:not(.open){visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s}
#sheet.open{transform:none;visibility:visible}
#sheet.full{top:0;max-height:none;border-radius:0;padding-top:var(--st)}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 12px 10px 18px}
.sh-head h2{flex:1;margin:0;font-size:18px;letter-spacing:-.01em}
.sh-body{overflow-y:auto;padding:4px 18px 24px;overscroll-behavior:contain}
.sh-body section{padding:14px 0;border-top:1px solid var(--line)}
.sh-body section:first-child{border-top:0;padding-top:4px}
.sh-body h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700}
.sh-body p{margin:0 0 10px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:6px 0}
.row .lbl{width:110px;flex:none;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#ff4d6d,#7a4dff)}
.row .x{width:32px;height:32px;display:grid;place-items:center;color:var(--faint)}
.row .x .i{width:16px;height:16px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;width:100%;text-align:left}
.toggle .sw{width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-checked="true"] .sw{background:#34c759}
.toggle[aria-checked="true"] .sw::after{transform:translateX(18px)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.cell{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#222}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .k{position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.cell .k .i{width:13px;height:13px}
.more-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.more-head img{width:56px;height:72px;object-fit:cover;border-radius:8px;background:#222;flex:none}
.more-head b{display:block;font-size:15px;line-height:1.3}
.more-head small{display:block;color:var(--muted);margin-top:3px}
.stack{display:flex;flex-direction:column;gap:8px}
.why{background:var(--sheet2);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:14px;margin-bottom:12px}
.src{display:flex;gap:8px;flex-wrap:wrap}
.src span{font-size:13px;padding:5px 10px;border-radius:99px;background:var(--sheet2)}
.src .ok{color:#7ee2a0} .src .no{color:var(--faint)}
textarea{width:100%;min-height:90px;background:var(--sheet2);color:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;font:16px/1.4 ui-monospace,Menlo,monospace}
.pass{width:100%;height:48px;background:var(--sheet2);border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;color:#fff;margin-bottom:12px}

/* ---------- toast ---------- */
#toast{position:absolute;left:50%;top:calc(62px + var(--st));z-index:30;transform:translate(-50%,-8px);opacity:0;transition:opacity .2s,transform .2s;
  background:rgba(28,28,33,.94);padding:10px 16px;border-radius:14px;font-size:13.5px;font-weight:600;max-width:88%;text-align:center;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<div id="app">
  <main id="feed" aria-label="Feed"></main>

  <header id="top">
    <div class="tl">
      <button id="brand" class="brand" aria-label="For you feed">Glimpse <small>For you</small></button>
      <button id="modechip" class="modechip" hidden aria-label="Back to For you"><svg class="i"><use href="#i-back"/></svg><span></span></button>
    </div>
    <div class="tr">
      <div id="spin" class="spinner" hidden></div>
      <button id="bSound" class="tb" aria-label="Sound"><svg class="i"><use href="#i-mute"/></svg></button>
      <button id="bSearch" class="tb" aria-label="Search"><svg class="i"><use href="#i-search"/></svg></button>
      <button id="bSaved" class="tb" aria-label="Saved"><svg class="i"><use href="#i-saved"/></svg></button>
      <button id="bYou" class="tb" aria-label="Your interests"><svg class="i"><use href="#i-user"/></svg></button>
    </div>
  </header>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="scrim"></div>
  <section id="sheet" role="dialog" aria-modal="true" aria-hidden="true"></section>
</div>

<noscript><p style="padding:24px">Glimpse needs JavaScript turned on.</p></noscript>

<script>
(() => {
'use strict';

/* ======================= constants ======================= */
const API = '/api/search';
const LS_PROFILE = 'glimpse.v1';
const LS_CACHE = 'glimpse.cache.v1';
const LS_PASS = 'glimpse.pass';
const DAY = 864e5;
const HALF_LIFE = 21 * DAY;           // interests fade by half every 3 weeks without activity
const CACHE_TTL = 20 * 3600e3;        // reuse search results on this device for 20h
const SEEN_HIDE = 7 * DAY;            // For You hides things you've seen in the last week
const STARTERS = ['Ocean waves', 'City at night', 'Mountains', 'Puppies', 'Street food', 'Northern lights',
  'Architecture', 'Rainy window', 'Skateboarding', 'Space', 'Coffee art', 'Forest'];
const SRC = {
  pexels: { name: 'Pexels', home: 'https://www.pexels.com' },
  pixabay: { name: 'Pixabay', home: 'https://pixabay.com' },
  youtube: { name: 'YouTube', home: 'https://www.youtube.com' },
};
const KIND_LABEL = { photo: 'Photos', video: 'Clips', youtube: 'YouTube' };
// How strongly each action teaches the feed. Positive = more like this.
const SIG = {
  like:    { terms: 1.0,  creator: 2.0,  kind: 0.8,  query: 1.0 },
  unlike:  { terms: -1.0, creator: -2.0, kind: -0.8, query: -1.0 },
  save:    { terms: 1.5,  creator: 3.0,  kind: 1.2,  query: 1.5 },
  unsave:  { terms: -1.5, creator: -3.0, kind: -1.2, query: -1.5 },
  watch:   { terms: 0.35, creator: 0.4,  kind: 0.35, query: 0.3 },
  skip:    { terms: -0.25, creator: -0.3, kind: -0.2, query: -0.2 },
  share:   { terms: 0.8,  creator: 1.0,  kind: 0.5,  query: 0.5 },
  open:    { terms: 0.5,  creator: 0.8,  kind: 0.3,  query: 0.3 },
  hide:    { terms: -2.0, creator: -4.0, kind: -0.6, query: -0.8 },
};
const STOP = new Set(('a an and are as at be by for from has have in into is it its of on or that the this to was were will with ' +
  'your you my our we they them their there here what when where who why how not no yes do does did can just about over under ' +
  'up down out off than then so very more most some any all each few such own same too also only video videos photo photos ' +
  'image images picture pictures stock footage free hd 4k uhd shorts short youtube pexels pixabay official new best top shot ' +
  'view close closeup clip clips background full one two day way get got make made like via vs amp').split(' '));

/* ======================= helpers ======================= */
const $ = (s, r = document) => r.querySelector(s);
const feedEl = $('#feed'), topEl = $('#top'), sheetEl = $('#sheet'), scrimEl = $('#scrim'), toastEl = $('#toast');
const now = () => Date.now();
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = (u) => (/^https:\/\//i.test(u || '') ? u : '#');
const icon = (n, cls) => `<svg class="i ${cls || ''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const ext = (href, text) => `<a href="${esc(safeUrl(href))}" target="_blank" rel="noopener">${esc(text)}</a>`;
const fmtDur = (s) => { s = Math.round(s || 0); const m = Math.floor(s / 60); return m + ':' + String(s % 60).padStart(2, '0'); };
const normQ = (q) => String(q || '').replace(/\s+/g, ' ').trim().toLowerCase().slice(0, 100);
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

function tokenize(text) {
  const words = String(text || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').match(/[\p{L}\p{N}]+/gu) || [];
  const out = [];
  for (let w of words) {
    if (w.length < 3 || STOP.has(w) || /^\d+$/.test(w)) continue;
    if (w.length > 4 && w.endsWith('ies')) w = w.slice(0, -3) + 'y';
    else if (w.length > 4 && w.endsWith('s') && !w.endsWith('ss') && !w.endsWith('us')) w = w.slice(0, -1);
    if (!STOP.has(w)) out.push(w);
  }
  return out;
}
const uniq = (a) => [...new Set(a)];

/* ======================= memory (this device) ======================= */
function freshProfile() {
  return {
    v: 1, created: now(), terms: {}, creators: {}, kinds: {}, queries: {}, recent: [], saved: [],
    liked: {}, hidden: {}, seen: {}, stats: { searches: 0, likes: 0, saves: 0, skips: 0, views: 0 },
    settings: { sound: false, shortOnly: true },
  };
}
function loadProfile() {
  try {
    const p = JSON.parse(localStorage.getItem(LS_PROFILE));
    if (p && p.v === 1) {
      const f = freshProfile();
      return Object.assign(f, p, { settings: Object.assign(f.settings, p.settings), stats: Object.assign(f.stats, p.stats) });
    }
  } catch (e) { /* corrupted or blocked: start fresh */ }
  return freshProfile();
}
let P = loadProfile();

// Weights fade over time so the feed follows what you're into now.
function eff(e) { return e ? e.w * Math.pow(0.5, (now() - e.t) / HALF_LIFE) : 0; }
function bump(map, key, delta, extra) {
  if (!key) return;
  const e = map[key];
  map[key] = Object.assign(e || {}, extra || {}, { w: clamp(eff(e) + delta, -15, 40), t: now() });
}
function pruneMap(map, max, byWeight) {
  const keys = Object.keys(map);
  if (byWeight) for (const k of keys) if (Math.abs(eff(map[k])) < 0.05 && !(map[k] && map[k].n)) delete map[k];
  const left = Object.keys(map);
  if (left.length <= max) return;
  left.sort((a, b) => (byWeight ? Math.abs(eff(map[b])) - Math.abs(eff(map[a])) : map[b] - map[a]));
  for (const k of left.slice(max)) delete map[k];
}
function prune() {
  pruneMap(P.terms, 600, true); pruneMap(P.creators, 250, true); pruneMap(P.queries, 80, true);
  pruneMap(P.seen, 3000); pruneMap(P.liked, 2000); pruneMap(P.hidden, 1500);
  if (P.saved.length > 300) P.saved.length = 300;
  if (P.recent.length > 12) P.recent.length = 12;
}
let saveTimer = 0;
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }
function saveNow() {
  clearTimeout(saveTimer);
  prune();
  const s = JSON.stringify(P);
  try { localStorage.setItem(LS_PROFILE, s); }
  catch (e) { try { localStorage.removeItem(LS_CACHE); C = {}; localStorage.setItem(LS_PROFILE, s); } catch (_) { /* storage full or blocked */ } }
}
let persistAsked = false;
function askPersist() {
  if (persistAsked) return; persistAsked = true;
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { /* not supported */ }
}

/* results cache: saves your API quotas and makes revisits instant */
let C = {};
try { C = JSON.parse(localStorage.getItem(LS_CACHE)) || {}; for (const k in C) if (!C[k] || now() - C[k].t > C[k].ttl) delete C[k]; } catch (e) { C = {}; }
function cacheGet(k) { const e = C[k]; return e && now() - e.t < e.ttl ? e.d : null; }
function cachePut(k, d, ttl) {
  C[k] = { t: now(), ttl, d };
  const keys = Object.keys(C);
  if (keys.length > 36) keys.sort((a, b) => C[a].t - C[b].t).slice(0, keys.length - 36).forEach((x) => delete C[x]);
  try { localStorage.setItem(LS_CACHE, JSON.stringify(C)); } catch (e) { C = {}; try { localStorage.removeItem(LS_CACHE); } catch (_) {} }
}

/* ======================= learning ======================= */
function itemTokens(it) {
  return uniq([...tokenize(it.title), ...(it.tags || []).flatMap(tokenize), ...tokenize(it.q)]).slice(0, 24);
}
function learn(it, sig) {
  const s = SIG[sig];
  if (!s || !it || it.kind === 'notice') return;
  const toks = it.tokens || itemTokens(it);
  const per = (s.terms * 2.5) / Math.sqrt(Math.max(1, toks.length));
  for (const t of toks) bump(P.terms, t, per);
  if (it.creator && it.creator.id) bump(P.creators, it.creator.id, s.creator, { name: it.creator.name, source: it.source });
  bump(P.kinds, it.kind, s.kind);
  if (it.q && (P.queries[it.q] || s.query > 0)) bump(P.queries, it.q, s.query, { n: (P.queries[it.q] && P.queries[it.q].n) || 0 });
  saveSoon();
}
function learnSearch(q) {
  const e = P.queries[q];
  bump(P.queries, q, 2.0, { n: ((e && e.n) || 0) + 1 });
  for (const t of tokenize(q)) bump(P.terms, t, 1.2);
  P.recent = [q, ...P.recent.filter((x) => x !== q)].slice(0, 12);
  P.stats.searches++;
  saveSoon();
}

/* ======================= ranking ======================= */
function score(it, mode, rarity) {
  // rarity(t): 1 for words few results share, ~0 for words every result has (like the search itself),
  // so the score reacts to what makes this item different.
  const toks = it.tokens || [];
  let sum = 0;
  const why = [];
  for (const t of toks) {
    const w = eff(P.terms[t]);
    if (!w) continue;
    sum += w * (rarity ? rarity(t) : 1);
    if (w > 0.6) why.push([t, w]);
  }
  const interest = 2.5 * Math.tanh(sum / Math.sqrt(Math.max(1, toks.length)) / 4);
  const cw = it.creator ? eff(P.creators[it.creator.id]) : 0;
  const creator = 1.2 * Math.tanh(cw / 3);
  const kind = 0.9 * Math.tanh(eff(P.kinds[it.kind]) / 4);
  const base = 0.8 * (1 - Math.min(it.rank || 0, 20) / 20);    // the source's own relevance order
  const seen = mode === 'search' && P.seen[it.id] ? -1.0 : 0;  // already seen: push down
  const explore = (Math.random() - 0.5) * 0.4;                 // a little variety
  it._why = why.sort((a, b) => b[1] - a[1]).slice(0, 3).map((x) => x[0]);
  it._fan = cw > 1.5;
  return base + interest + creator + kind + seen + explore;
}
function rankBatch(items, mode) {
  const df = {};
  for (const it of items) for (const t of new Set(it.tokens || [])) df[t] = (df[t] || 0) + 1;
  const n = items.length;
  const rarity = (t) => (n < 3 ? 1 : clamp(1 - ((df[t] || 1) - 1) / (n - 1), 0, 1));
  const pool = items.map((it) => ({ it, s: score(it, mode, rarity) }));
  const tail = S.items.filter((x) => x.kind !== 'notice');
  const kinds = tail.slice(-2).map((x) => x.kind);
  const creators = tail.slice(-4).map((x) => x.creator && x.creator.id);
  const out = [];
  while (pool.length) {
    let bi = 0, bs = -Infinity;
    for (let i = 0; i < pool.length; i++) {
      const { it, s } = pool[i];
      let pen = 0;
      const k1 = kinds[kinds.length - 1], k2 = kinds[kinds.length - 2];
      if (it.kind === k1) pen += 0.45;
      if (it.kind === k1 && it.kind === k2) pen += 0.9;       // avoid 3 of a kind in a row
      if (it.creator && creators.includes(it.creator.id)) pen += 0.8;
      if (s - pen > bs) { bs = s - pen; bi = i; }
    }
    const { it } = pool.splice(bi, 1)[0];
    out.push(it);
    kinds.push(it.kind); if (kinds.length > 2) kinds.shift();
    creators.push(it.creator && it.creator.id); if (creators.length > 4) creators.shift();
  }
  return out;
}
function weightedPick(pairs, k) {
  const pool = pairs.slice(), out = [];
  while (out.length < k && pool.length) {
    const total = pool.reduce((s, p) => s + Math.max(0.05, p[1]), 0);
    let r = Math.random() * total, i = 0;
    for (; i < pool.length - 1; i++) { r -= Math.max(0.05, pool[i][1]); if (r <= 0) break; }
    out.push(pool.splice(i, 1)[0][0]);
  }
  return out;
}
function pickSeeds() {
  const qs = Object.entries(P.queries).map(([q, e]) => [q, eff(e)]).filter((x) => x[1] > 0.25)
    .sort((a, b) => b[1] - a[1]).slice(0, 8);
  const seeds = weightedPick(qs, 3);
  const used = new Set(seeds.flatMap(tokenize));
  const terms = Object.entries(P.terms).map(([t, e]) => [t, eff(e)])
    .filter(([t, w]) => w > 1.2 && !used.has(t)).sort((a, b) => b[1] - a[1]).slice(0, 8);
  return uniq([...seeds, ...weightedPick(terms, seeds.length ? 1 : 3)]);
}
function topInterests(n) {
  return Object.entries(P.terms).map(([t, e]) => [t, eff(e)]).filter((x) => x[1] > 0.5)
    .sort((a, b) => b[1] - a[1]).slice(0, n);
}

/* ======================= state ======================= */
const S = {
  mode: 'foryou', query: '', items: [], ids: new Set(), active: -1, viewStart: 0, mounted: new Set(),
  loading: false, done: false, cursor: null, seeds: [], round: 0, gen: 0, status: null,
  passHash: (() => { try { return localStorage.getItem(LS_PASS) || ''; } catch (e) { return ''; } })(),
  sheet: null, shown: new Set(),
};
const hasYT = () => !S.status || S.status.sources.youtube;
const isSaved = (id) => P.saved.some((x) => x.id === id);

/* ======================= server calls ======================= */
async function api(o) {
  const u = new URLSearchParams();
  u.set('q', o.q);
  u.set('page', String(o.page || 1));
  if (o.yt) u.set('yt', o.yt);
  if (o.media === false) u.set('media', '0');
  if (!P.settings.shortOnly) u.set('short', '0');
  if (S.passHash) u.set('k', S.passHash);
  const key = u.toString();
  const hit = cacheGet(key);
  if (hit) return hit;
  const r = await fetch(API + '?' + key, { headers: { accept: 'application/json' } });
  if (r.status === 401) { setPass(''); askPasscode(); throw new Error('passcode'); }
  let data;
  try { data = await r.json(); } catch (e) { throw new Error('The server sent something unexpected.'); }
  if (!r.ok) throw new Error(data.message || 'Search failed.');
  cachePut(key, data, data.errors && data.errors.length ? 10 * 60e3 : CACHE_TTL);
  return data;
}
async function loadStatus() {
  try {
    const r = await fetch(API + '?status=1', { cache: 'no-store' });
    if (r.ok) S.status = await r.json();
  } catch (e) { /* offline: assume configured */ }
  return S.status;
}
function setPass(h) { S.passHash = h; try { h ? localStorage.setItem(LS_PASS, h) : localStorage.removeItem(LS_PASS); } catch (e) {} }
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
function reportErrors(data) {
  for (const e of (data && data.errors) || []) {
    const key = e.source + ':' + e.code;
    if (S.shown.has(key)) continue;
    S.shown.add(key);
    if (e.code === 'no-keys') continue;
    toast(e.message, 5000);
  }
}

/* ======================= toast ======================= */
let toastQ = [], toastBusy = false;
function toast(msg, ms) {
  toastQ.push([msg, ms || 2600]);
  if (!toastBusy) nextToast();
}
function nextToast() {
  const n = toastQ.shift();
  if (!n) { toastBusy = false; return; }
  toastBusy = true;
  toastEl.textContent = n[0];
  toastEl.classList.add('show');
  setTimeout(() => { toastEl.classList.remove('show'); setTimeout(nextToast, 220); }, n[1]);
}

/* ======================= slides ======================= */
function slideEl(i) { return feedEl.children[i] || null; }
function railBtn(cls, ic, label, on) {
  return `<button class="act ${cls}${on ? ' on' : ''}" data-act="${cls}" aria-label="${label}"${on !== undefined ? ` aria-pressed="${!!on}"` : ''}><span class="ring">${icon(ic)}</span><span class="lbl">${label}</span></button>`;
}
function creditHTML(it) {
  const c = it.creator || {};
  if (it.source === 'youtube') return `${ext(c.url, c.name)} · ${ext(it.pageUrl, 'Watch on YouTube')}`;
  const s = SRC[it.source];
  const what = it.kind === 'video' ? 'Video' : 'Photo';
  return `${what} by ${ext(c.url, c.name)} ${it.source === 'pixabay' ? 'from' : 'on'} ${ext(it.pageUrl || s.home, s.name)}`;
}
function showTags(it) {
  const skip = new Set(tokenize(S.mode === 'search' ? S.query : it.q));
  const fromTags = (it.tags || []).flatMap(tokenize);
  return uniq([...fromTags, ...tokenize(it.title)]).filter((t) => !skip.has(t) && t.length < 18).slice(0, 3);
}
function makeSlide(it, i) {
  const el = document.createElement('article');
  el.dataset.i = i;
  if (it.kind === 'notice') { el.className = 'slide'; el.innerHTML = it.html; return el; }
  el.className = 'slide ' + (it.kind === 'youtube' ? 'yt' : 'media');
  const liked = !!P.liked[it.id], saved = isSaved(it.id);
  const badge = it.kind === 'youtube'
    ? icon('yt') + 'YouTube' + (it.duration ? ' · ' + fmtDur(it.duration) : '')
    : icon(it.kind === 'video' ? 'clip' : 'photo') + SRC[it.source].name + ' · ' + (it.kind === 'video' ? 'Clip' + (it.duration ? ' ' + fmtDur(it.duration) : '') : 'Photo');
  const tags = showTags(it).map((t) => `<button class="tag" data-tag="${esc(t)}">#${esc(t)}</button>`).join('');
  el.innerHTML = `
    <div class="stage" style="--c:${/^#[0-9a-f]{6}$/i.test(it.color || '') ? it.color : '#0d0d10'}"></div>
    ${it.kind === 'youtube' ? '' : '<div class="shade"></div>'}
    <div class="info">
      <span class="badge">${badge}</span>
      <h2 class="title">${esc(it.title)}</h2>
      <p class="credit">${creditHTML(it)}</p>
      ${tags ? `<div class="tags">${tags}</div>` : ''}
    </div>
    <div class="rail">
      ${railBtn('like', 'heart', liked ? 'Liked' : 'Like', liked)}
      ${railBtn('save', 'bookmark', saved ? 'Saved' : 'Save', saved)}
      ${railBtn('share', 'share', 'Share')}
      ${railBtn('more', 'dots', 'More')}
    </div>
    ${it.kind === 'video' ? '<div class="progress"><i></i></div>' : ''}`;
  return el;
}
function updateRail(i) {
  const it = S.items[i], el = slideEl(i);
  if (!it || !el) return;
  const liked = !!P.liked[it.id], saved = isSaved(it.id);
  const lb = el.querySelector('.act.like'), sb = el.querySelector('.act.save');
  if (lb) { lb.classList.toggle('on', liked); lb.setAttribute('aria-pressed', liked); lb.querySelector('.lbl').textContent = liked ? 'Liked' : 'Like'; }
  if (sb) { sb.classList.toggle('on', saved); sb.setAttribute('aria-pressed', saved); sb.querySelector('.lbl').textContent = saved ? 'Saved' : 'Save'; }
}
function popBtn(i, cls) {
  const b = slideEl(i) && slideEl(i).querySelector('.act.' + cls);
  if (!b) return;
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
}

/* media mounting: only the current slide and its neighbours hold media */
function screenAR() { return feedEl.clientWidth / Math.max(1, feedEl.clientHeight); }
function coverFit(it) {
  if (it._fit) return it._fit === 'cover';
  const r = (it.width / Math.max(1, it.height)) / screenAR();
  return r > 0.7 && r < 1.5;
}
function bgImg(src) { const b = new Image(); b.className = 'bg'; b.alt = ''; b.decoding = 'async'; if (src) b.src = src; return b; }
let safeBottom = 0;
function measureSafe() {
  const d = document.createElement('div');
  d.style.cssText = 'position:absolute;visibility:hidden;height:env(safe-area-inset-bottom,0px)';
  document.body.append(d); safeBottom = d.offsetHeight; d.remove();
}
function sizePlayer(box, it, el) {
  // Fit the player between the top bar and the caption so nothing ever covers it.
  const W = feedEl.clientWidth, H = feedEl.clientHeight;
  const top = topEl.offsetHeight;
  const info = el && el.querySelector('.info');
  const bottomEdge = info && info.offsetTop > 0 ? info.offsetTop - 14 : H - 200 - safeBottom;
  const ar = (it.width || 16) / (it.height || 9);
  const avail = Math.max(200, bottomEdge - top);
  let w = W - 20, h = w / ar;
  if (h > avail) { h = avail; w = h * ar; }
  w = Math.max(w, 200); h = Math.max(h, 200);
  Object.assign(box.style, { width: w + 'px', height: h + 'px', left: (W - w) / 2 + 'px', top: top + Math.max(0, (avail - h) / 2) + 'px' });
}
function ytPoster(it) {
  return `<button class="poster" data-act="ytplay" aria-label="Play ${esc(it.title)}"><img src="${esc(safeUrl(it.thumb))}" alt=""><span>${icon('play')}</span></button>`;
}
function startYT(box, it) {
  if (box.querySelector('iframe')) return;
  const p = new URLSearchParams({
    autoplay: '1', mute: P.settings.sound ? '0' : '1', playsinline: '1', rel: '0',
    loop: '1', playlist: it.ytId, enablejsapi: '1', origin: location.origin,
  });
  const f = document.createElement('iframe');
  f.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(it.ytId)}?${p}`;
  f.title = it.title;
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  f.allowFullscreen = true;
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  box.innerHTML = '';
  box.append(f);
}
function stopYT(box, it) {
  if (box.querySelector('iframe') || !box.firstChild) box.innerHTML = ytPoster(it);
}
function ytCommand(i, func) {
  const f = slideEl(i) && slideEl(i).querySelector('iframe');
  if (f && f.contentWindow) f.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args: [] }), 'https://www.youtube-nocookie.com');
}
function playVideo(v) {
  v.muted = !P.settings.sound;
  const p = v.play();
  if (p && p.catch) p.catch(() => {
    if (!v.muted) { v.muted = true; v.play().catch(() => {}); toastOnce('sound', 'Tap the speaker to turn sound on'); }
  });
}
function toastOnce(key, msg) { if (!S.shown.has(key)) { S.shown.add(key); toast(msg); } }

function mount(i, active) {
  const it = S.items[i], el = slideEl(i);
  if (!it || !el || it.kind === 'notice') return;
  const st = el.querySelector('.stage');
  if (it.refreshable && it.fetchedAt && now() - it.fetchedAt > 20 * 3600e3 && !it._refreshing) { refreshItem(i); return; }
  if (!st.firstChild) {
    if (it.kind === 'photo') {
      const cover = coverFit(it);
      if (!cover) st.append(bgImg(it.thumb || it.image));
      const img = new Image();
      img.className = 'fg' + (cover ? ' cover' : '');
      img.alt = it.title; img.decoding = 'async';
      img.onerror = () => mediaFailed(i);
      img.src = it.image;
      st.append(img);
    } else if (it.kind === 'video') {
      const cover = coverFit(it);
      if (!cover && it.poster) st.append(bgImg(it.poster));
      const v = document.createElement('video');
      v.className = 'fg' + (cover ? ' cover' : '');
      v.muted = true; v.loop = true; v.playsInline = true;
      v.setAttribute('playsinline', ''); v.setAttribute('muted', ''); v.setAttribute('disablepictureinpicture', '');
      v.preload = active ? 'auto' : 'metadata';
      if (it.poster) v.poster = it.poster;
      v.onerror = () => mediaFailed(i);
      const bar = el.querySelector('.progress i');
      v.ontimeupdate = () => { if (bar && v.duration) bar.style.width = (100 * v.currentTime / v.duration).toFixed(2) + '%'; };
      v.src = it.video;
      st.append(v);
    } else if (it.kind === 'youtube') {
      st.append(bgImg(it.thumb));
      const box = document.createElement('div');
      box.className = 'player';
      sizePlayer(box, it, el);
      box.innerHTML = ytPoster(it);
      st.append(box);
    }
  }
  if (it.kind === 'video') {
    const v = st.querySelector('video');
    if (v) { if (active) { v.preload = 'auto'; playVideo(v); } else v.pause(); }
    const pi = st.querySelector('.paused-ico'); if (pi) pi.remove();
  } else if (it.kind === 'youtube') {
    const box = st.querySelector('.player');
    if (box) active ? startYT(box, it) : stopYT(box, it);
  }
}
function unmount(i) {
  const el = slideEl(i);
  const st = el && el.querySelector('.stage');
  if (!st || !st.firstChild) return;
  st.querySelectorAll('video').forEach((v) => { v.pause(); v.removeAttribute('src'); v.load(); });
  st.innerHTML = '';
}
function mediaFailed(i) {
  const it = S.items[i], el = slideEl(i);
  if (!it || !el) return;
  if (it.refreshable && !it._refreshTried) { it._refreshTried = true; refreshItem(i); return; }
  it._failed = true;
  const st = el.querySelector('.stage');
  st.innerHTML = '<div class="fail">This one didn’t load. Swipe up for the next.</div>';
}
async function refreshItem(i) {
  const it = S.items[i];
  it._refreshing = true;
  try {
    const u = new URLSearchParams({ refresh: it.id });
    if (S.passHash) u.set('k', S.passHash);
    const r = await fetch(API + '?' + u);
    const d = await r.json();
    if (d.item) {
      Object.assign(it, { image: d.item.image, thumb: d.item.thumb, video: d.item.video || it.video, poster: d.item.poster || it.poster, fetchedAt: now() });
      const sv = P.saved.find((x) => x.id === it.id);
      if (sv) { Object.assign(sv, { image: it.image, thumb: it.thumb, video: it.video, poster: it.poster, fetchedAt: it.fetchedAt }); saveSoon(); }
    }
  } catch (e) { /* keep old links */ }
  it._refreshing = false;
  it.fetchedAt = it.fetchedAt && now() - it.fetchedAt < 20 * 3600e3 ? it.fetchedAt : now();
  unmount(i);
  if (Math.abs(i - S.active) <= 2) mount(i, i === S.active);
}

/* ======================= active slide + view tracking ======================= */
function watchMs(it) {
  if (it.kind === 'photo') return 4500;
  if (it.kind === 'youtube') return 15000;
  return clamp((it.duration || 10) * 800, 5000, 15000);
}
function endView(i, forward) {
  const it = S.items[i];
  const t0 = S.viewStart;
  S.viewStart = 0;
  if (!it || it.kind === 'notice' || !t0 || S.mode === 'saved' || it._failed) return;
  const dwell = performance.now() - t0;
  if (dwell >= 700) { if (!P.seen[it.id]) P.stats.views++; P.seen[it.id] = now(); }
  const engaged = P.liked[it.id] || isSaved(it.id);
  if (forward && dwell < 1500 && !engaged && !it._skipped && !it._watched) {
    it._skipped = true; P.stats.skips++; learn(it, 'skip');
  } else if (dwell >= watchMs(it) && !it._watched) {
    it._watched = true; learn(it, 'watch');
  }
  saveSoon();
}
function setActive(i) {
  if (i === S.active || i < 0 || i >= S.items.length) return;
  const prev = S.active;
  if (prev >= 0) endView(prev, i > prev);
  S.active = i;
  S.viewStart = performance.now();
  for (const j of [...S.mounted]) if (Math.abs(j - i) > 2) { unmount(j); S.mounted.delete(j); }
  for (const j of [i, i + 1, i - 1, i + 2]) {
    if (j >= 0 && j < S.items.length) { mount(j, j === i); S.mounted.add(j); }
  }
  if (S.items.length - i <= 5) loadMore();
}
const io = new IntersectionObserver((entries) => {
  for (const e of entries) if (e.isIntersecting && e.intersectionRatio >= 0.6) setActive(+e.target.dataset.i);
}, { root: feedEl, threshold: [0.6] });

/* ======================= feed building ======================= */
function tagItems(items, q) {
  const t = now();
  return (items || []).map((it) => Object.assign(it, { q, fetchedAt: it.fetchedAt || t, tokens: itemTokens(Object.assign(it, { q })) }));
}
function appendItems(batch, opts) {
  const fresh = [];
  for (const it of batch) {
    if (!it || S.ids.has(it.id) || (P.hidden[it.id] && S.mode !== 'saved')) continue;
    S.ids.add(it.id);
    fresh.push(it);
  }
  if (!fresh.length) return 0;
  removeLoader();
  const list = opts && opts.noRank ? fresh : rankBatch(fresh, S.mode);
  const frag = document.createDocumentFragment(), els = [];
  for (const it of list) {
    const el = makeSlide(it, S.items.length);
    S.items.push(it);
    frag.append(el); els.push(el);
  }
  feedEl.append(frag);
  els.forEach((el) => io.observe(el));
  return list.length;
}
let noticeN = 0;
function appendNotice(html) {
  const it = { kind: 'notice', id: 'notice-' + (++noticeN), html };
  const el = makeSlide(it, S.items.length);
  S.items.push(it);
  feedEl.append(el);
  io.observe(el);
  return it;
}
function appendLoader() {
  const it = appendNotice('<div class="notice center"><div class="spinner"></div><p>Finding things you’ll like…</p></div>');
  it.loader = true;
}
function removeLoader() {
  const i = S.items.findIndex((x) => x.loader);
  if (i < 0) return;
  // Loader is only ever the last slide in an otherwise empty feed.
  io.unobserve(slideEl(i)); slideEl(i).remove(); S.items.splice(i, 1);
  if (S.active === i) S.active = -1;
}
function reset(mode) {
  S.gen++;
  if (S.active >= 0) endView(S.active, false);
  saveSoon();
  io.disconnect();
  feedEl.querySelectorAll('video').forEach((v) => { v.pause(); v.removeAttribute('src'); v.load(); });
  feedEl.innerHTML = '';
  feedEl.scrollTop = 0;
  Object.assign(S, { mode, items: [], ids: new Set(), active: -1, viewStart: 0, mounted: new Set(), loading: false, done: false, cursor: null, seeds: [], round: 0, blocked: false, noKeys: false });
  $('#spin').hidden = true;
  updateHeader();
}
function updateHeader() {
  const chip = $('#modechip'), brand = $('#brand');
  if (S.mode === 'foryou') { chip.hidden = true; brand.hidden = false; return; }
  brand.hidden = true; chip.hidden = false;
  chip.querySelector('span').textContent = S.mode === 'saved' ? 'Saved' : S.query;
}

async function loadMore() {
  if (S.loading || S.done || S.mode === 'saved') return;
  S.loading = true;
  const gen = S.gen;
  const realCount = () => S.items.filter((x) => x.kind !== 'notice').length;
  if (realCount()) $('#spin').hidden = false;
  try {
    let added = 0, rounds = 0;
    while (added < 4 && rounds < 4 && !S.done) {
      rounds++;
      const batch = S.mode === 'search' ? await searchPage() : await forYouRound();
      if (gen !== S.gen) return;
      added += appendItems(batch);
    }
    if (S.done && gen === S.gen) {
      removeLoader();
      if (!S.items.some((x) => x.end)) {
        const n = appendNotice(realCount() || (S.mode === 'foryou' && !S.noKeys) ? endHTML() : emptyHTML());
        n.end = true;
      }
    }
  } catch (e) {
    if (gen !== S.gen) return;
    if (e.message !== 'passcode') {
      if (!realCount()) { removeLoader(); appendNotice(errorHTML(e.message)); S.done = true; }
      else toast('Couldn’t load more. Check your connection.');
    }
  } finally {
    if (gen === S.gen) { S.loading = false; $('#spin').hidden = true; }
  }
}
async function searchPage() {
  const c = S.cursor;
  const ytParam = c.yt && c.ytPages < 2 ? c.yt : '';
  if (c.page == null && !ytParam) { S.done = true; return []; }
  const data = await api({ q: S.query, page: c.page || 1, yt: ytParam, media: c.page != null });
  reportErrors(data);
  if (data.blocked) { S.done = true; S.blocked = true; return []; }
  if (data.errors && data.errors.some((e) => e.code === 'no-keys')) { S.done = true; S.noKeys = true; return []; }
  if (c.page != null) c.page = data.next.page;
  if (ytParam) { c.ytPages++; c.yt = data.next.yt; }
  if (c.page == null && !(c.yt && c.ytPages < 2)) S.done = true;
  return tagItems(data.items, S.query);
}
async function forYouRound() {
  const live = S.seeds.filter((s) => !s.done);
  if (!live.length) { S.done = true; return []; }
  const round = S.round++;
  const res = await Promise.all(live.map((s, idx) => {
    const yt = round < 2 && idx < 2 && s.yt ? s.yt : '';
    if (s.page == null && !yt) { s.done = true; return { s, d: null }; }
    return api({ q: s.q, page: s.page || 1, yt, media: s.page != null })
      .then((d) => ({ s, d, yt })).catch((e) => ({ s, e }));
  }));
  let items = [];
  for (const r of res) {
    if (r.e) { if (r.e.message === 'passcode') throw r.e; r.s.done = true; continue; }
    if (!r.d) continue;
    reportErrors(r.d);
    if (r.d.errors && r.d.errors.some((e) => e.code === 'no-keys')) { S.done = true; S.noKeys = true; return []; }
    if (r.s.page != null) r.s.page = r.d.next.page;
    if (r.yt) r.s.yt = r.d.next.yt;
    if (r.s.page == null && !(r.s.yt && S.round < 2)) r.s.done = true;
    items = items.concat(tagItems(r.d.items, r.s.q));
  }
  const cutoff = now() - SEEN_HIDE;
  return items.filter((it) => !(P.seen[it.id] > cutoff));
}

function goForYou() {
  reset('foryou');
  if (S.status && !S.status.sources.pexels && !S.status.sources.pixabay && !S.status.sources.youtube) {
    appendNotice(setupHTML()); S.done = true; return;
  }
  const seeds = pickSeeds();
  if (!seeds.length) { appendNotice(welcomeHTML()); S.done = true; return; }
  S.seeds = seeds.map((q) => ({ q, page: 1, yt: hasYT() ? 'first' : null, done: false }));
  appendLoader();
  loadMore();
}
function goSearch(q, learnIt) {
  q = normQ(q);
  if (!q) return;
  if (learnIt !== false) learnSearch(q);
  reset('search');
  S.query = q;
  S.blocked = false;
  S.cursor = { page: 1, yt: hasYT() ? 'first' : null, ytPages: 0 };
  updateHeader();
  appendLoader();
  loadMore();
}
function goSaved(index) {
  reset('saved');
  S.done = true;
  if (!P.saved.length) { appendNotice(`<div class="notice center"><h2>Nothing saved yet</h2><p>Tap ${icon('bookmark')} on anything you want to keep.</p></div>`); return; }
  appendItems(P.saved.map((x) => Object.assign({}, x)), { noRank: true });
  requestAnimationFrame(() => {
    feedEl.scrollTop = (index || 0) * feedEl.clientHeight;
    setActive(index || 0);
  });
}

/* ======================= notice slides ======================= */
function attributionLine() {
  const st = (S.status && S.status.sources) || { pexels: true, pixabay: false, youtube: true };
  const parts = [];
  if (st.pexels) parts.push(`Photos and videos provided by ${ext('https://www.pexels.com', 'Pexels')}`);
  if (st.pixabay) parts.push(`${st.pexels ? 'and' : 'Photos and videos from'} ${ext('https://pixabay.com', 'Pixabay')}`);
  if (st.youtube) parts.push(`· Videos from ${ext('https://www.youtube.com', 'YouTube')}`);
  return parts.join(' ');
}
function installHint() {
  if (standalone()) return '';
  if (isIOS) return '<p class="fine">Tip: tap Share → <b>Add to Home Screen</b>. Safari can erase what a site remembers if you don’t open it for a week; the Home Screen app keeps it.</p>';

}

}

  return `<div class="notice center"><h2>No results for “${esc(S.query)}”</h2><p>Try fewer or different words.</p>${starterChips(STARTERS.slice(0, 6))}</div>`;

/* ======================= actions ======================= */
function slim(it) {
  const o = {};
  for (const k of ['id', 'source', 'kind', 'title', 'tags', 'creator', 'pageUrl', 'width', 'height', 'color', 'image', 'thumb', 'video', 'poster', 'duration', 'ytId', 'q', 'tokens', 'refreshable', 'fetchedAt']) if (it[k] !== undefined) o[k] = it[k];
  return o;
}
function toggleLike(i, onlyOn) {
  const it = S.items[i];
  if (!it || it.kind === 'notice') return;
  if (P.liked[it.id]) {
    if (onlyOn) return;
    delete P.liked[it.id]; P.stats.likes = Math.max(0, P.stats.likes - 1); learn(it, 'unlike');
  } else {
    P.liked[it.id] = now(); P.stats.likes++; learn(it, 'like'); askPersist();
  }
  updateRail(i); popBtn(i, 'like');
}
function toggleSave(i) {
  const it = S.items[i];
  if (!it || it.kind === 'notice') return;
  if (isSaved(it.id)) {
    P.saved = P.saved.filter((x) => x.id !== it.id); P.stats.saves = Math.max(0, P.stats.saves - 1); learn(it, 'unsave');
    toast('Removed from Saved');
  } else {
    P.saved.unshift(slim(it)); P.stats.saves++; learn(it, 'save'); askPersist();
    toast('Saved');
  }
  updateRail(i); popBtn(i, 'save');
}
async function share(i) {
  const it = S.items[i];
  if (!it) return;
  learn(it, 'share');
  const data = { title: it.title, url: it.pageUrl };
  try {
    if (navigator.share) { await navigator.share(data); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  copyText(it.pageUrl).then((ok) => toast(ok ? 'Link copied' : it.pageUrl));
}
function hideItem(i) {
  const it = S.items[i];
  if (!it) return;
  P.hidden[it.id] = now();
  learn(it, 'hide');
  closeSheet();
  toast('Got it — you’ll see less like this');
  const el = slideEl(i);
  if (el) {
    unmount(i);
    el.querySelector('.stage').innerHTML = '<div class="fail">Hidden. Swipe up for the next one.</div>';
    it._failed = true;
    setTimeout(() => feedEl.scrollTo({ top: (i + 1) * feedEl.clientHeight, behavior: 'smooth' }), 350);
  }
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.append(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
function burst(x, y) {
  const b = document.createElement('div');
  b.className = 'burst';
  b.innerHTML = icon('heart');
  b.style.left = x + 'px'; b.style.top = y + 'px';
  $('#app').append(b);
  setTimeout(() => b.remove(), 800);
}
function toggleSound() {
  P.settings.sound = !P.settings.sound;
  saveSoon();
  renderSoundBtn();
  const it = S.items[S.active], el = slideEl(S.active);
  if (it && el && it.kind === 'video') {
    const v = el.querySelector('video');
    if (v) { v.muted = !P.settings.sound; if (!v.muted) v.play().catch(() => {}); }
  }
  if (it && it.kind === 'youtube') ytCommand(S.active, P.settings.sound ? 'unMute' : 'mute');
  toast(P.settings.sound ? 'Sound on' : 'Sound off', 1200);
}
function renderSoundBtn() {
  const b = $('#bSound');
  b.innerHTML = icon(P.settings.sound ? 'sound' : 'mute');
  b.setAttribute('aria-label', P.settings.sound ? 'Sound on' : 'Sound off');
}

/* taps on the media: single tap = pause/play (or show whole photo), double tap = like */
let tapTimer = 0, lastTap = 0;
function onStageTap(i, e) {
  const t = performance.now();
  if (t - lastTap < 280) {
    clearTimeout(tapTimer); lastTap = 0;
    const r = $('#app').getBoundingClientRect();
    burst(e.clientX - r.left, e.clientY - r.top);
    toggleLike(i, true);
    return;
  }
  lastTap = t;
  tapTimer = setTimeout(() => {
    const it = S.items[i], el = slideEl(i);
    if (!it || !el) return;
    if (it.kind === 'video') {
      const v = el.querySelector('video');
      if (!v) return;
      const st = el.querySelector('.stage');
      if (v.paused) { playVideo(v); const pi = st.querySelector('.paused-ico'); if (pi) pi.remove(); }
      else { v.pause(); if (!st.querySelector('.paused-ico')) st.insertAdjacentHTML('beforeend', `<div class="paused-ico">${icon('play')}</div>`); }
    } else if (it.kind === 'photo') {
      const img = el.querySelector('.stage .fg');
      if (!img) return;
      it._fit = img.classList.contains('cover') ? 'contain' : 'cover';
      unmount(i); mount(i, i === S.active);
    }
  }, 280);
}

/* ======================= sheets ======================= */
function openSheet(html, opts) {
  opts = opts || {};
  const replacing = !!S.sheet;
  S.sheet = opts.name || 'sheet';
  sheetEl.className = (opts.full ? 'full ' : '') + 'open';
  sheetEl.innerHTML = html;
  sheetEl.setAttribute('aria-hidden', 'false');
  scrimEl.classList.add('show');
  if (replacing) history.replaceState({ sheet: S.sheet, mode: S.mode, q: S.query }, '');
  else history.pushState({ sheet: S.sheet, mode: S.mode, q: S.query }, '');
  // pause the current video while a sheet is up
  const v = slideEl(S.active) && slideEl(S.active).querySelector('video');
  if (v) v.pause();
}
function hideSheet() {
  if (!S.sheet) return;
  S.sheet = null;
  sheetEl.classList.remove('open');
  sheetEl.setAttribute('aria-hidden', 'true');
  scrimEl.classList.remove('show');
  const v = slideEl(S.active) && slideEl(S.active).querySelector('video');
  if (v && !slideEl(S.active).querySelector('.paused-ico')) playVideo(v);
}
function closeSheet() {
  if (!S.sheet) return;
  if (history.state && history.state.sheet) history.back(); else hideSheet();
}
function sheetHead(title) {
  return `<div class="sh-head"><h2>${esc(title)}</h2><button class="tb" data-act="close" aria-label="Close">${icon('close')}</button></div>`;
}

function openSearch() {
  const rec = P.recent.map((q) => `<span class="chip"><button data-q="${esc(q)}"><b>${esc(q)}</b></button><button class="x" data-act="forget" data-v="${esc(q)}" aria-label="Remove ${esc(q)}">${icon('close')}</button></span>`).join('');
  const ints = topInterests(10).map(([t]) => `<button class="chip hot" data-q="${esc(t)}">${esc(t)}</button>`).join('');
  openSheet(`
    <div class="sh-head" style="padding-right:8px">
      <form class="sbar" data-search style="flex:1">${icon('search')}<input id="q" name="q" type="search" placeholder="Search photos, clips, videos" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="100" aria-label="Search"></form>
      <button class="btn" data-act="close" style="background:none;padding:0 8px">Cancel</button>
    </div>
    <div class="sh-body">
      ${rec ? `<section><h3>Recent</h3><div class="chips">${rec}</div></section>` : ''}
      ${ints ? `<section><h3>Your interests</h3><div class="chips">${ints}</div></section>` : ''}
      <section><h3>Try</h3>${starterChips(STARTERS)}</section>
      <section><p class="fine">Safe search is on for every source. ${attributionLine()}</p></section>
    </div>`, { full: true, name: 'search' });
  const inp = $('#q', sheetEl);
  if (inp) inp.focus();
}
function openSavedSheet() {
  if (!P.saved.length) {
    openSheet(sheetHead('Saved') + `<div class="sh-body"><p>Nothing saved yet. Tap ${icon('bookmark')} on anything you want to keep.</p></div>`, { name: 'saved' });
    return;
  }
  const cells = P.saved.map((it, i) => `<button class="cell" data-act="opensaved" data-v="${i}" aria-label="${esc(it.title)}">
      <img src="${esc(safeUrl(it.thumb || it.image))}" alt="" loading="lazy">
      ${it.kind !== 'photo' ? `<span class="k">${icon(it.kind === 'youtube' ? 'yt' : 'play')}</span>` : ''}</button>`).join('');
  openSheet(sheetHead(`Saved (${P.saved.length})`) + `<div class="sh-body"><div class="grid">${cells}</div></div>`, { name: 'saved' });
}
function openYou() {
  const ints = topInterests(15);
  const max = ints.length ? ints[0][1] : 1;
  const rows = ints.map(([t, w]) => `<div class="row"><span class="lbl">${esc(t)}</span><span class="bar"><i style="width:${Math.max(6, 100 * w / max).toFixed(0)}%"></i></span><button class="x" data-act="dropterm" data-v="${esc(t)}" aria-label="Forget ${esc(t)}">${icon('close')}</button></div>`).join('');
  const kinds = ['photo', 'video', 'youtube'].map((k) => [k, Math.exp(Math.tanh(eff(P.kinds[k]) / 4))]);
  const tot = kinds.reduce((s, x) => s + x[1], 0);
  const mix = kinds.map(([k, v]) => `<div class="row"><span class="lbl">${KIND_LABEL[k]}</span><span class="bar"><i style="width:${(100 * v / tot * 1.6).toFixed(0)}%"></i></span><span style="width:38px;text-align:right;color:var(--muted)">${Math.round(100 * v / tot)}%</span></div>`).join('');
  const fans = Object.entries(P.creators).map(([id, e]) => [e.name || id, eff(e), e.source]).filter((x) => x[1] > 1).sort((a, b) => b[1] - a[1]).slice(0, 8)
    .map(([n, , s]) => `<span class="chip">${esc(n)} <small style="color:var(--faint)">${esc((SRC[s] || {}).name || '')}</small></span>`).join('');
  const st = S.status ? S.status.sources : null;
  const srcs = st ? ['pexels', 'pixabay', 'youtube'].map((s) => `<span class="${st[s] ? 'ok' : 'no'}">${SRC[s].name} ${st[s] ? '✓ on' : '– no key'}</span>`).join('') : '<span class="no">Couldn’t check</span>';
  const tog = (key, label, on) => `<button class="toggle" role="switch" aria-checked="${on}" data-act="toggle" data-v="${key}"><span>${label}</span><span class="sw"></span></button>`;
  openSheet(sheetHead('What Glimpse has learned') + `<div class="sh-body">
    <section><h3>Top interests</h3>${rows || '<p>Nothing yet. Search, like and save things, and your interests show up here.</p>'}</section>
    <section><h3>Your mix</h3>${mix}</section>
    ${fans ? `<section><h3>Creators you like</h3><div class="chips">${fans}</div></section>` : ''}
    <section><p class="fine" style="margin:0">${P.stats.searches} searches · ${P.stats.likes} likes · ${P.saved.length} saved · ${P.stats.views} viewed · ${P.stats.skips} skipped</p></section>
    <section><h3>Settings</h3>
      ${tog('sound', 'Play with sound', P.settings.sound)}
      ${tog('shortOnly', 'Short YouTube videos only (under 4 min)', P.settings.shortOnly)}
    </section>
    <section><h3>Sources</h3><div class="src">${srcs}<span class="ok">Safe search: strict, always on</span></div></section>
    <section><h3>Keep your memory</h3>
      <p>Everything Glimpse learns is stored only in this browser on this device.</p>
      ${installHint()}
      <div class="stack" style="margin-top:10px">
        <button class="btn wide" data-act="backup">${icon('link')}Copy backup code</button>
        <textarea id="restore" placeholder="Paste a backup code here to restore"></textarea>
        <button class="btn wide" data-act="restore">Restore from code</button>
      </div>
    </section>
    <section><h3>About &amp; privacy</h3>
      <p>Glimpse uses YouTube API Services. By watching YouTube videos here you agree to the ${ext('https://www.youtube.com/t/terms', 'YouTube Terms of Service')}. See the ${ext('https://policies.google.com/privacy', 'Google Privacy Policy')}.</p>
      <p>Privacy: your searches go to this app’s own server, which asks ${st && !st.pixabay ? 'Pexels' : 'Pexels/Pixabay'} and YouTube for results. Your likes, saves, skips and interests never leave this device. Media loads straight from those services, and the YouTube player is in privacy-enhanced mode. Tap “Forget everything” to delete it all.</p>
      <p class="fine">${attributionLine()}</p>
    </section>
    <section><button class="btn wide danger" data-act="wipe">Forget everything</button></section>
  </div>`, { name: 'you' });
}
function openMore(i) {
  const it = S.items[i];
  if (!it || it.kind === 'notice') return;
  const reasons = [];
  if (it.q) reasons.push(S.mode === 'search' ? `you searched “${esc(it.q)}”` : `you’re into “${esc(it.q)}”`);
  const w = (it._why || []).filter((t) => !tokenize(it.q).includes(t));
  if (w.length) reasons.push('it matches ' + w.map((t) => `“${esc(t)}”`).join(', '));
  if (it._fan) reasons.push(`you’ve liked ${esc(it.creator.name)} before`);
  const src = SRC[it.source].name;
  openSheet(`<div class="sh-body" style="padding-top:18px">
    <div class="more-head"><img src="${esc(safeUrl(it.thumb || it.image))}" alt=""><div><b>${esc(it.title)}</b><small>${creditHTML(it)}</small></div></div>
    ${reasons.length ? `<div class="why">Showing this because ${reasons.join(', and ')}.</div>` : ''}
    <div class="stack">
      <button class="btn wide" data-act="hide" data-v="${i}">${icon('ban')}Not interested</button>
      <button class="btn wide" data-act="similar" data-v="${i}">${icon('search')}More like this</button>
      <a class="btn wide" href="${esc(safeUrl(it.pageUrl))}" target="_blank" rel="noopener" data-act="open" data-v="${i}">${icon('open')}Open on ${src}</a>
      <button class="btn wide" data-act="copylink" data-v="${i}">${icon('link')}Copy link</button>
      <button class="btn wide" data-act="close">Close</button>
    </div></div>`, { name: 'more' });
}
let passPromptOpen = false;
function askPasscode() {
  if (passPromptOpen) return;
  passPromptOpen = true;
  openSheet(sheetHead('Enter passcode') + `<div class="sh-body">
    <p>This Glimpse is private. Enter the passcode you set in Vercel (APP_PASSCODE). You only need to do this once on this device.</p>
    <form data-pass><input class="pass" name="p" type="password" autocomplete="current-password" placeholder="Passcode" aria-label="Passcode"><button class="btn primary wide">Unlock</button></form>
  </div>`, { name: 'pass' });
  const inp = sheetEl.querySelector('input'); if (inp) inp.focus();
}

/* backup / restore */
function exportCode() {
  const json = JSON.stringify(Object.assign({}, P, { seen: {} }));
  const bytes = new TextEncoder().encode(json);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return 'GLIMPSE1:' + btoa(bin);
}
function importCode(code) {
  const m = /^GLIMPSE1:([A-Za-z0-9+/=\s]+)$/.exec(String(code || '').trim());
  if (!m) throw new Error('That doesn’t look like a Glimpse backup code.');
  const bin = atob(m[1].replace(/\s+/g, ''));
  const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  const p = JSON.parse(new TextDecoder().decode(bytes));
  if (!p || p.v !== 1 || typeof p.terms !== 'object') throw new Error('That backup code is damaged.');
  const f = freshProfile();
  P = Object.assign(f, p, { settings: Object.assign(f.settings, p.settings), stats: Object.assign(f.stats, p.stats) });
  saveNow();
}

/* Saved YouTube videos are re-checked after ~25 days; removed or private ones drop out. */
async function refreshSavedYouTube() {
  if (!hasYT() || now() - (P.ytCheckedAt || 0) < DAY) return;
  const stale = P.saved.filter((x) => x.source === 'youtube' && now() - (x.fetchedAt || 0) > 25 * DAY).slice(0, 50);
  P.ytCheckedAt = now();
  if (!stale.length) { saveSoon(); return; }
  try {
    const u = new URLSearchParams({ refresh: stale.map((x) => x.id).join(',') });
    if (S.passHash) u.set('k', S.passHash);
    const r = await fetch(API + '?' + u);
    if (!r.ok) return;
    const fresh = new Map(((await r.json()).items || []).map((x) => [x.id, x]));
    const staleIds = new Set(stale.map((x) => x.id));
    P.saved = P.saved.flatMap((x) => {
      if (!staleIds.has(x.id)) return [x];
      const f = fresh.get(x.id);
      if (!f) return [];
      return [Object.assign(x, { title: f.title, tags: f.tags, creator: f.creator, thumb: f.thumb, width: f.width, height: f.height, duration: f.duration, fetchedAt: now() })];
    });
    saveSoon();
  } catch (e) { /* try again tomorrow */ }
}

/* ======================= events ======================= */
feedEl.addEventListener('click', (e) => {
  const slide = e.target.closest('.slide');
  if (!slide) return;
  const i = +slide.dataset.i;
  if (handleCommon(e, i)) return;
  if (e.target.closest('a, button, input, form, .info, .rail')) return;
  if (e.target.closest('.stage') && slide.classList.contains('media')) onStageTap(i, e);
});
sheetEl.addEventListener('click', (e) => { handleCommon(e, S.active); });
scrimEl.addEventListener('click', closeSheet);

function handleCommon(e, i) {
  const qBtn = e.target.closest('[data-q]');
  if (qBtn) { e.preventDefault(); startSearch(qBtn.dataset.q); return true; }
  const tag = e.target.closest('[data-tag]');
  if (tag) { e.preventDefault(); bump(P.terms, tag.dataset.tag, 1.0); startSearch(tag.dataset.tag); return true; }
  const a = e.target.closest('[data-act]');
  if (!a) {
    const link = e.target.closest('a[href^="https://"]');
    if (link && S.items[i] && S.items[i].kind !== 'notice' && !link.closest('#sheet')) learn(S.items[i], 'open');
    return false;
  }
  const act = a.dataset.act, v = a.dataset.v;
  const ii = v !== undefined && /^\d+$/.test(v) ? +v : i;
  switch (act) {
    case 'like': toggleLike(i); break;
    case 'save': toggleSave(i); break;
    case 'share': share(i); break;
    case 'more': openMore(i); break;
    case 'ytplay': { const box = a.closest('.player'); if (box && S.items[i]) { if (i !== S.active) setActive(i); startYT(box, S.items[i]); } break; }
    case 'close': closeSheet(); break;
    case 'hide': hideItem(ii); break;
    case 'similar': { const it = S.items[ii]; const words = uniq([...(it._why || []), ...(it.tokens || [])]).slice(0, 3).join(' '); closeSheetThen(() => goSearchPush(words)); break; }
    case 'open': if (S.items[ii]) learn(S.items[ii], 'open'); return false;
    case 'copylink': { const it = S.items[ii]; copyText(it.pageUrl).then((ok) => toast(ok ? 'Link copied' : it.pageUrl)); closeSheet(); break; }
    case 'opensaved': closeSheetThen(() => { goSaved(+v); history.pushState({ mode: 'saved' }, '', location.pathname); }); break;
    case 'forget': P.recent = P.recent.filter((x) => x !== v); saveSoon(); a.closest('.chip').remove(); break;
    case 'dropterm': delete P.terms[v]; for (const q of Object.keys(P.queries)) if (tokenize(q).includes(v)) delete P.queries[q]; saveSoon(); a.closest('.row').remove(); toast(`Forgot “${v}”`); break;
    case 'toggle': {
      if (v === 'sound') { toggleSound(); a.setAttribute('aria-checked', P.settings.sound); }
      else { P.settings[v] = !P.settings[v]; a.setAttribute('aria-checked', P.settings[v]); saveSoon(); }
      break;
    }
    case 'backup': copyText(exportCode()).then((ok) => toast(ok ? 'Backup code copied. Keep it somewhere safe, like Notes.' : 'Couldn’t copy. Try again.', 3500)); break;
    case 'restore': {
      try { importCode($('#restore', sheetEl).value); toast('Restored'); closeSheetThen(goForYou); } catch (err) { toast(err.message, 3500); }
      break;
    }
    case 'wipe':
      if (a.dataset.armed) {
        P = freshProfile(); saveNow();
        try { localStorage.removeItem(LS_CACHE); } catch (_) {} C = {};
        toast('Everything forgotten'); closeSheetThen(goForYou);
      } else { a.dataset.armed = '1'; a.textContent = 'Tap again to erase all likes, saves and interests'; }
      break;
    case 'recheck': loadStatus().then(goForYou); break;
    case 'retry': S.mode === 'search' ? goSearch(S.query, false) : goForYou(); break;
    case 'opensearch': openSearch(); break;
    default: return false;
  }
  e.preventDefault();
  return true;
}
function closeSheetThen(fn) {
  if (!S.sheet) { fn(); return; }
  if (history.state && history.state.sheet) { pendingAfterPop = fn; history.back(); } else { hideSheet(); fn(); }
}
let pendingAfterPop = null;
function goSearchPush(q) {
  q = normQ(q);
  if (!q) return;
  history.pushState({ mode: 'search', q }, '', '?q=' + encodeURIComponent(q));
  goSearch(q);
}
function startSearch(q) {
  if (S.sheet) closeSheetThen(() => goSearchPush(q)); else goSearchPush(q);
}

document.addEventListener('submit', (e) => {
  const f = e.target;
  if (f.matches('[data-search]')) {
    e.preventDefault();
    const q = f.querySelector('input').value;
    if (normQ(q)) { f.querySelector('input').blur(); startSearch(q); }
  } else if (f.matches('[data-pass]')) {
    e.preventDefault();
    const val = f.querySelector('input').value;
    if (!val) return;
    sha256(val).then((h) => {
      setPass(h);
      passPromptOpen = false;
      closeSheetThen(() => (S.mode === 'search' ? goSearch(S.query, false) : goForYou()));
    });
  }
});

window.addEventListener('popstate', (e) => {
  if (S.sheet) {
    if (S.sheet === 'pass') passPromptOpen = false;
    hideSheet();
    const fn = pendingAfterPop; pendingAfterPop = null;
    if (fn) fn();
    return;
  }
  const st = e.state || { mode: 'foryou' };
  if (st.mode === 'search' && st.q) { if (S.mode !== 'search' || S.query !== st.q) goSearch(st.q, false); }
  else if (st.mode === 'saved') goSaved(0);
  else if (S.mode !== 'foryou') goForYou();
});

$('#brand').addEventListener('click', () => { if (feedEl.scrollTop > 0) feedEl.scrollTo({ top: 0, behavior: 'smooth' }); else goForYou(); });
$('#modechip').addEventListener('click', () => { history.pushState({ mode: 'foryou' }, '', location.pathname); goForYou(); });
$('#bSearch').addEventListener('click', openSearch);
$('#bSaved').addEventListener('click', openSavedSheet);
$('#bYou').addEventListener('click', openYou);
$('#bSound').addEventListener('click', toggleSound);

document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea')) { if (e.key === 'Escape') closeSheet(); return; }
  if (S.sheet) { if (e.key === 'Escape') closeSheet(); return; }
  const go = (d) => feedEl.scrollTo({ top: clamp(S.active + d, 0, S.items.length - 1) * feedEl.clientHeight, behavior: 'smooth' });
  if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); go(-1); }
  else if (e.key === 'l') toggleLike(S.active);
  else if (e.key === 's') toggleSave(S.active);
  else if (e.key === '/') { e.preventDefault(); openSearch(); }
});

document.addEventListener('visibilitychange', () => {
  const el = slideEl(S.active);
  const v = el && el.querySelector('video');
  if (document.hidden) {
    if (S.active >= 0) endView(S.active, false);
    if (v) v.pause();
    saveNow();
  } else {
    S.viewStart = performance.now();
    if (v && !S.sheet && !el.querySelector('.paused-ico')) playVideo(v);
  }
});
window.addEventListener('pagehide', saveNow);

let resizeTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    measureSafe();
    for (const j of S.mounted) {
      const it = S.items[j], box = slideEl(j) && slideEl(j).querySelector('.player');
      if (it && box) sizePlayer(box, it, slideEl(j));
    }
    if (S.active >= 0) feedEl.scrollTop = S.active * feedEl.clientHeight;
  }, 150);
});

/* ======================= start ======================= */
measureSafe();
renderSoundBtn();
window.__glimpse = { S, get P() { return P; }, tokenize, score, rankBatch, pickSeeds, learn, eff };

(async () => {
  const startQ = new URLSearchParams(location.search).get('q');
  const statusP = loadStatus();
  if (startQ) {
    history.replaceState({ mode: 'search', q: normQ(startQ) }, '', '?q=' + encodeURIComponent(normQ(startQ)));
    await statusP;
    goSearch(startQ);
  } else {
    history.replaceState({ mode: 'foryou' }, '', location.pathname);
    await statusP;
    goForYou();
  }
  if (S.status && S.status.passcode && !S.passHash) askPasscode();
  else refreshSavedYouTube();
})();
})();
</script>
